<style>
*{box-sizing:border-box}
body{margin:0;background:#F7F7F5;color:#2C2C2A;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 font-size:14px;line-height:1.65}
.wrap{max-width:1180px;margin:0 auto;padding:32px 24px 80px}
header{border-bottom:1px solid #E3E1DA;padding-bottom:20px;margin-bottom:28px}
h1{font-size:24px;font-weight:500;margin:0 0 8px}
.sub{color:#6B6A65;font-size:13px}
h2{font-size:17px;font-weight:500;margin:40px 0 6px;padding-top:8px}
h2 .idx{color:#A8A69E;margin-right:8px;font-variant-numeric:tabular-nums}
.hint{color:#6B6A65;font-size:12.5px;margin:0 0 16px}
.card{background:#fff;border:1px solid #E8E6DF;border-radius:12px;padding:18px 20px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.metric{background:#fff;border:1px solid #E8E6DF;border-radius:10px;padding:14px 16px}
.metric .l{color:#6B6A65;font-size:12.5px;margin-bottom:4px}
.metric .v{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.metric .d{font-size:12px;color:#8A8880;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:#6B6A65;padding:8px 10px;border-bottom:1px solid #E8E6DF;
 position:sticky;top:0;background:#fff;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #F0EEE8;vertical-align:middle}
tr:hover td{background:#FAFAF8}
.num{font-variant-numeric:tabular-nums;text-align:right}
.up{color:#C0392B;font-weight:500}
.down{color:#1D7A4F;font-weight:500}
.flat{color:#8A8880}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;line-height:18px}
.t-blue{background:#E6F1FB;color:#12558F}
.t-purple{background:#EEEDFE;color:#453CA0}
.t-amber{background:#FAEEDA;color:#8A5A0E}
.t-red{background:#FCEBEB;color:#A32D2B}
.t-green{background:#EAF3DE;color:#3B6D11}
.t-gray{background:#F1EFE8;color:#5F5E5A}
ul.f{margin:0;padding-left:18px}
ul.f li{margin-bottom:9px}
.scroll{max-height:460px;overflow:auto;border:1px solid #E8E6DF;border-radius:10px;background:#fff}
.chart{position:relative;width:100%}
select,input{font:inherit;padding:5px 9px;border:1px solid #DCDAD2;border-radius:7px;background:#fff;color:#2C2C2A}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#6B6A65;margin-bottom:10px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px}
.q{border-left:3px solid #CECBF6;padding:2px 0 2px 14px;margin:10px 0;color:#4A4945;font-size:13.5px}
.src{color:#8A8880;font-size:12px;margin-top:6px}
footer{margin-top:56px;padding-top:20px;border-top:1px solid #E3E1DA;color:#8A8880;font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.bar{height:6px;border-radius:3px;background:#E8E6DF;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:#378ADD}
.tip{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#E3E1DA;color:#8A8880;font-size:10px;cursor:help;vertical-align:baseline;margin-left:4px;font-weight:600;position:relative;font-family:sans-serif;flex-shrink:0;line-height:1}
.tip:hover{background:#378ADD;color:#fff}
.tip .tt{display:none}
.tooltip-portal{position:fixed;visibility:hidden;opacity:0;background:#1F1F1D;color:#FFFFFF;padding:9px 12px;border-radius:7px;font-size:12px;font-weight:400;line-height:1.6;white-space:normal;width:240px;max-width:260px;z-index:99999;text-align:left;box-shadow:0 6px 22px rgba(0,0,0,.5);pointer-events:none;transition:opacity .12s}
.tooltip-portal.show{visibility:visible;opacity:1}
.tooltip-portal::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1F1F1D}
th .tip{vertical-align:middle}
/* 第8章 区域格局 行布局 */
.regional-card{padding:16px 18px}
.regional-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.regional-card .markets{color:#8A8880;font-size:12px;margin:0 0 12px;line-height:1.6}
.regional-card table.reg{width:100%;border-collapse:collapse;table-layout:fixed}
.regional-card table.reg th{font-weight:500;color:#6B6A65;padding:6px 8px;font-size:12px;text-align:left;background:transparent;border-bottom:1px solid #E8E6DF;position:static;white-space:nowrap}
.regional-card table.reg th.col-name{width:32%}
.regional-card table.reg th.col-bar{width:44%;padding-left:14px;padding-right:14px}
.regional-card table.reg th.col-seats{width:24%;text-align:right;padding-right:10px}
.regional-card table.reg td{padding:10px 8px;border-bottom:1px solid #F0EEE8;vertical-align:middle}
.regional-card table.reg td.col-name{font-size:13.5px;color:#2C2C2A;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.regional-card table.reg td.col-bar .share-num{font-size:12px;color:#4A4945;font-variant-numeric:tabular-nums;margin-bottom:4px;display:block}
.regional-card table.reg td.col-bar .bar{height:7px;border-radius:4px;background:#EFEDE5;overflow:hidden;display:block}
.regional-card table.reg td.col-bar .bar i{display:block;height:100%;background:linear-gradient(90deg,#378ADD,#5B9DEA);border-radius:4px}
.regional-card table.reg td.col-seats{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:#2C2C2A;font-weight:500;white-space:nowrap}
.regional-card table.reg td.col-seats .badge{display:inline-block;padding:2px 9px;border-radius:11px;background:#EEF3FB;color:#185FA5;font-size:12px;line-height:1.6;font-weight:500}
.regional-card table.reg tr:last-child td{border-bottom:none}
.regional-card table.reg tr:hover td{background:#FAFBFD}
.clickable{transition:all .15s ease;border-left:3px solid transparent}
.clickable:hover{border-left-color:#378ADD;background:#FAFBFD;transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.clickable.active{border-left-color:#378ADD;background:#F0F6FC}
.detail-panel{margin-top:12px;border-left:3px solid #378ADD;animation:fadeIn .2s ease}
.detail-panel .panel-title{font-size:14px;font-weight:500;margin-bottom:12px;color:#12558F}
.detail-panel .panel-body p{margin:0 0 10px;line-height:1.7}
.detail-panel table{margin:8px 0 4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>出海短剧竞品情报日报</h1>
  <div class="sub" id="hdr"></div>
</header>
<div id="app"></div>
<footer id="ft"></footer>

  document.querySelectorAll('.tip').forEach(tip=>{

function mergeScores(ios, android){
  if(!ios || !ios.length) return android || [];
  if(!android || !android.length) return ios;
  const map={};
  ios.forEach(s=>{ map[s.product]={product:s.product,score:s.score,markets:s.markets,grossing_top10:s.grossing_top10,grossing_top3:s.grossing_top3,platforms:['iOS']}; });
  android.forEach(s=>{
    if(map[s.product]){
      const m=map[s.product];
      m.score+=s.score;
      m.markets=Math.max(m.markets,s.markets);
      m.grossing_top10+=s.grossing_top10;
      m.grossing_top3+=s.grossing_top3;
      m.platforms.push('Android');
    } else {
      map[s.product]={product:s.product,score:s.score,markets:s.markets,grossing_top10:s.grossing_top10,grossing_top3:s.grossing_top3,platforms:['Android']};
    }
  });
  const arr=Object.values(map);
  const mx=Math.max(...arr.map(s=>s.score))||1;
  arr.forEach(s=>s.score=Math.round(s.score/mx*100*10)/10);
  arr.sort((a,b)=>b.score-a.score);
  arr.forEach((s,i)=>s.rank=i+1);
  return arr;
}

function renderRegionalCards(regional){
  let h='<div class="grid g2">';
  Object.entries(regional||{}).forEach(([r,v])=>{

    const focus = (r==='欧美英语区'||r==='日韩');
    h += `<div class="card regional-card" ${focus?'style="border-color:#B5D4F4"':''}>
    <div class="head"><b>${r}</b>${focus?'<span class="tag t-blue">重点</span>':''}</div>
    <div class="markets">${v.markets.map(mk).join(' · ')}</div>
    <table class="reg"><thead><tr>
     <th class="col-name">产品</th>
     <th class="col-bar">竞争力份额<span class="tip">?<span class="tt">该产品在本区域所有在榜短剧应用中的畅销榜竞争力占比。计算方式：该产品的排名分值之和 ÷ 本区域全部短剧排名分值之和。百分比越高=该产品在本区域越强势。&gt;20%为绝对主导，10-20%为第一梯队，&lt;5%为边缘参与。</span></span></th>
     <th class="col-seats">TOP20席位<span class="tip">?<span class="tt">该产品在本区域多少个国家/地区的 App Store（或 Google Play）娱乐分类畅销榜前 20 名中占据了席位。席位越多=该产品在本区域覆盖越广、存在感越强。0 席=未进入任何国家的 TOP20。</span></span></th>
    </tr></thead><tbody>`;
    v.leaders.forEach(l=>{
      h += `<tr><td class="col-name" title="${esc(l.product)}">${esc(l.product)}</td>
      <td class="col-bar"><span class="share-num">${l.share}%</span><div class="bar"><i style="width:${Math.min(100,l.share*1.6)}%"></i></div></td>
      <td class="col-seats"><span class="badge">${l.top20_seats} 席</span></td></tr>`;
    });
    h += `</tbody></table></div>`;
  });
  return h+'</div>';
}

          y:{title:{display:true,text:'畅销榜领先国家/地区数',color:'#6B6A65'},beginAtZero:true,grid:GRID,ticks:TICK}}}});
}

if((I.product_trend||[]).length){
const tr=I.product_trend;
new Chart(document.getElementById('cTrend'),{type:'bar',
 data:{labels:tr.map(t=>t.product),datasets:[{data:tr.map(t=>t.avg_delta),
  backgroundColor:tr.map(t=>t.avg_delta>0?'#C0392B':'#1D7A4F'),borderRadius:3,barPercentage:.7}]},
 options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
  plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{const t=tr[c.dataIndex];
   return [`加权均变 ${t.avg_delta>0?'+':''}${t.avg_delta} 位`,`上升 ${t.improved_markets} / 下滑 ${t.worsened_markets} 市场`];}}}},
  scales:{x:{grid:GRID,ticks:TICK,title:{display:true,text:'← 排名下滑　　排名上升 →',color:'#6B6A65'}},
          y:{grid:{display:false},ticks:{...TICK,autoSkip:false}}}}});
}

/* Android 走势图 */
if(HAS_AND && IA && (IA.product_trend||[]).length && document.getElementById('cTrendAnd')){
const atr=IA.product_trend;
new Chart(document.getElementById('cTrendAnd'),{type:'bar',
 data:{labels:atr.map(t=>t.product),datasets:[{data:atr.map(t=>t.avg_delta),
  backgroundColor:atr.map(t=>t.avg_delta>0?'#C0392B':'#1D7A4F'),borderRadius:3,barPercentage:.7}]},
 options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
  plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{const t=atr[c.dataIndex];
   return [`加权均变 ${t.avg_delta>0?'+':''}${t.avg_delta} 位`,`上升 ${t.improved_markets} / 下滑 ${t.worsened_markets} 市场`];}}}},
  scales:{x:{grid:GRID,ticks:TICK,title:{display:true,text:'← 排名下滑　　排名上升 →',color:'#6B6A65'}},
          y:{grid:{display:false},ticks:{...TICK,autoSkip:false}}}}});
}

initTips();
