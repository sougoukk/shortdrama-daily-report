<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短剧出海情报日报</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif; background:#0f1117; color:#e0e0e0; display:flex; flex-direction:column; }
  .header {
    background:linear-gradient(135deg,#1a1d29,#252836);
    padding:12px 24px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid #2a2d3a;
    flex-shrink:0;
  }
  .header-left h1 { font-size:17px; font-weight:600; color:#fff; letter-spacing:0.5px; }
  .header-left .subtitle { font-size:11px; color:#666; margin-top:2px; }
  .header-right { font-size:11px; color:#555; text-align:right; }
  .header-right .latest { color:#4f6ef7; font-weight:600; font-size:13px; }
  .date-bar {
    display:flex; gap:6px; overflow-x:auto;
    padding:10px 24px;
    background:#161821;
    border-bottom:1px solid #2a2d3a;
    flex-shrink:0;
    scrollbar-width:thin;
    scrollbar-color:#363949 transparent;
  }
  .date-bar::-webkit-scrollbar { height:4px; }
  .date-bar::-webkit-scrollbar-thumb { background:#363949; border-radius:2px; }
  .date-btn {
    flex-shrink:0;
    padding:7px 14px;
    border-radius:7px;
    background:#252836;
    color:#888;
    text-decoration:none;
    font-size:12.5px;
    transition:all 0.15s;
    white-space:nowrap;
    border:1px solid transparent;
  }
  .date-btn:hover { background:#2f3245; color:#ccc; }
  .date-btn.active {
    background:#4f6ef7;
    color:#fff;
    border-color:#5d7aff;
    box-shadow:0 2px 8px rgba(79,110,247,0.3);
  }
  .frame-wrap {
    flex:1;
    position:relative;
    overflow:hidden;
    min-height:0;
  }
  .frame-wrap iframe {
    width:100%; height:100%; border:none;
    display:block;
    background:#fff;
  }
  .loading {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#444; font-size:14px;
  }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">

</div>
<div class="date-bar">

      <a href="reports/2026-08-07.html" class="date-btn " data-date="2026-08-07">8月7日 周五</a>

      <a href="reports/2026-08-05.html" class="date-btn " data-date="2026-08-05">8月5日 周三</a>
</div>
<div class="frame-wrap">
  <iframe id="reportFrame" src="reports/2026-08-19.html" loading="eager"></iframe>
</div>
<script>
  document.querySelectorAll('.date-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      document.querySelectorAll('.date-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('reportFrame').src = btn.getAttribute('href');
    });
  });
</script>
</body>
</html>
